services:
  frontend:
    build:
      context: ./frontend
      target: production  # Use the production stage of the Dockerfile
    ports:
      - "80:80"  # Expose port 80 for serving the frontend via Nginx
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      target: production
    environment:
      - NODE_ENV=production  # Set production environment
    env_file:
      - ./Backend/.env
    ports:
      - "3000:3000"  # Expose backend service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
